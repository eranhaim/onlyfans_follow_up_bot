services:
  postgres:
    image: postgres:16-alpine
    container_name: followup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-followup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-followup}
      POSTGRES_DB: ${POSTGRES_DB:-followup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-followup} -d ${POSTGRES_DB:-followup}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: followup-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://followup:followup@postgres:5432/followup}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8087}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: followup-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8087}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
